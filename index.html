<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактив: Учимся работать в команде</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

:root {
    --primary: #6c5ce7;
    --secondary: #fd79a8;
    --success: #00b894;
    --warning: #fdcb6e;
    --info: #0984e3;
    --dark: #2d3436;
    --light: #f7f5ff;
    --bg: #f0edff;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

body {
    background: linear-gradient(135deg, var(--bg) 0%, #fef9f3 50%, #e8f8f0 100%);
    color: var(--dark);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "МЯГКАЯ МАТЕМАТИКА · КОМАНДА";
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 60px; font-weight: 900; color: rgba(108, 92, 231, 0.03);
    white-space: nowrap; pointer-events: none; z-index: 0; letter-spacing: 5px;
}

.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

h1 { text-align: center; font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
.subtitle { text-align: center; color: #636e72; margin-bottom: 25px; font-weight: 600; }

/* Навигация по разделам */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
.tab-btn {
    padding: 10px 18px; border: 2px solid transparent; border-radius: 30px;
    background: #fff; color: #636e72; font-weight: 800; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
.tab-btn:hover { border-color: var(--primary); color: var(--primary); }
.tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 15px rgba(108,92,231,0.3); }

/* Экран */
.screen { display: none; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Памятка */
.memo {
    background: #fff; padding: 20px; border-radius: 16px; margin-bottom: 20px;
    border-left: 6px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
.memo h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.2rem; }
.memo p { font-size: 1rem; line-height: 1.6; margin-bottom: 8px; }
.memo b { color: var(--secondary); }

/* Drag & Drop */
.dnd-container {
    display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;
}
.dnd-pool {
    flex: 1; min-width: 200px; background: #fff; padding: 15px; border-radius: 16px;
    border: 3px dashed #e0dff5; min-height: 150px; display: flex; flex-direction: column; gap: 8px;
}
.dnd-pool h4 { text-align: center; color: #b2bec3; margin-bottom: 10px; font-size: 0.9rem; }
.dnd-item {
    padding: 10px 15px; background: #f8f9fa; border: 2px solid #e0dff5; border-radius: 8px;
    font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center;
}
.dnd-item:hover { border-color: var(--primary); background: var(--light); }
.dnd-item.dragging { opacity: 0.5; }
.dnd-item.correct { background: #d6f7e9; border-color: var(--success); color: var(--success); }
.dnd-item.wrong { background: #fdeaea; border-color: #e74c3c; color: #e74c3c; }

.dnd-zone {
    flex: 1; min-width: 150px; background: #fff; padding: 15px; border-radius: 16px;
    border: 3px solid #e0dff5; text-align: center; min-height: 150px;
    display: flex; flex-direction: column; gap: 8px; transition: 0.2s;
}
.dnd-zone.drag-over { border-color: var(--primary); background: var(--light); }
.dnd-zone h4 { color: var(--primary); margin-bottom: 10px; font-size: 1rem; }

/* Колесо фортуны */
.wheel-section {
    display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;
    background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
.wheel-wrapper { position: relative; width: 200px; height: 200px; margin-bottom: 20px; }
.wheel {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(
        var(--primary) 0deg 45deg, var(--secondary) 45deg 90deg,
        var(--warning) 90deg 135deg, var(--success) 135deg 180deg,
        var(--info) 180deg 225deg, var(--primary) 225deg 270deg,
        var(--secondary) 270deg 315deg, var(--warning) 315deg 360deg
    );
    transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    border: 4px solid #fff; box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}
.wheel-pointer {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    font-size: 30px; color: var(--dark); z-index: 10;
}
.wheel-btn {
    padding: 12px 30px; background: var(--primary); color: #fff; border: none;
    border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s;
}
.wheel-btn:hover { background: var(--secondary); transform: scale(1.05); }
.wheel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.wheel-result {
    margin-top: 15px; font-size: 1.1rem; font-weight: 800; color: var(--primary);
    text-align: center; min-height: 30px; max-width: 600px;
}
.hint-btn {
    display: block; margin: 10px auto 0; padding: 8px 20px;
    background: #fffbea; border: 2px solid var(--warning); border-radius: 20px;
    font-weight: 800; color: #b8860b; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
}
.hint-btn:hover { background: var(--warning); color: #fff; }
.hint-text {
    margin-top: 10px; font-size: 0.95rem; color: #636e72; background: #f7f5ff;
    padding: 10px; border-radius: 8px; border-left: 4px solid var(--info); text-align: left;
    animation: fadeIn 0.3s;
}

/* Викторина */
.quiz-section {
    background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
.quiz-q { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; }
.quiz-opts { display: flex; flex-direction: column; gap: 10px; }
.quiz-opt {
    padding: 12px; border: 2px solid #e0dff5; border-radius: 10px;
    font-weight: 700; cursor: pointer; transition: 0.2s; text-align: left;
}
.quiz-opt:hover { background: var(--light); border-color: var(--primary); }
.quiz-opt.correct { background: #d6f7e9; border-color: var(--success); color: var(--success); }
.quiz-opt.wrong { background: #fdeaea; border-color: #e74c3c; color: #e74c3c; }
</style>
</head>

// ==========================================
// ЛОГИКА РАБОТЫ
// ==========================================
let currentSection = 0;

// 1. Отрисовка меню
function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    gameData.forEach((data, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === currentSection ? 'active' : ''}`;
        btn.textContent = data.title;
        btn.onclick = () => loadSection(index);
        tabs.appendChild(btn);
    });
}

// 2. Загрузка экрана
function loadSection(index) {
    currentSection = index;
    renderTabs();
    
    const data = gameData[index];
    const content = document.getElementById('content');
    
    content.innerHTML = `
        <div class="screen active">
            <!-- Памятка -->
            <div class="memo">
                ${data.memo}
            </div>

            <!-- Drag & Drop -->
            <h3 style="margin-bottom:10px; color:var(--info);">🎮 Игра: Сортировка</h3>
            <p style="margin-bottom:10px; font-size:0.95rem;">${data.dnd.instruction}</p>
            <div class="dnd-container" id="dnd-container">
                <div class="dnd-pool" id="dnd-pool">
                    <h4>Перетащи меня 👇</h4>
                </div>
                ${data.dnd.zones.map((zone, zIdx) => `
                    <div class="dnd-zone" data-zone="${zIdx}" ondrop="drop(event)" ondragover="allowDrop(event)">
                        <h4>${zone}</h4>
                    </div>
                `).join('')}
            </div>

            <!-- Колесо фортуны -->
            <h3 style="margin-bottom:10px; color:var(--secondary);">🎡 Колесо фортуны</h3>
            <div class="wheel-section">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer">▼</div>
                    <div class="wheel" id="wheel"></div>
                </div>
                <button class="wheel-btn" id="spin-btn" onclick="spinWheel()">Крутить!</button>
                <div class="wheel-result" id="wheel-result">Нажми на кнопку, чтобы получить задание</div>
            </div>

            <!-- Викторина -->
            <h3 style="margin-bottom:10px; color:var(--success);">✅ Викторина</h3>
            <div class="quiz-section">
                <div class="quiz-q">${data.quiz.q}</div>
                <div class="quiz-opts">
                    ${data.quiz.opts.map((opt, oIdx) => `
                        <button class="quiz-opt" onclick="checkQuiz(this, ${oIdx === data.quiz.a})">${opt}</button>
                    `).join('')}
                </div>
            </div>
        </div>
    `;

    // Инициализация Drag & Drop
    initDnd(data.dnd.items);
}

// 3. Логика Drag & Drop (с поддержкой кликов)
function initDnd(items) {
    const pool = document.getElementById('dnd-pool');
    let draggedItem = null;
    let selectedItem = null;

    // Перемешиваем
    const shuffled = [...items].sort(() => Math.random() - 0.5);

    shuffled.forEach(item => {
        const el = document.createElement('div');
        el.className = 'dnd-item';
        el.textContent = item.text;
        el.dataset.zone = item.zone;
        
        // События для мыши
        el.draggable = true;
        el.addEventListener('dragstart', (e) => {
            draggedItem = el;
            e.dataTransfer.effectAllowed = 'move';
        });

        // События для клика (мобильные)
        el.onclick = () => {
            if (el.parentElement.classList.contains('dnd-zone')) {
                pool.appendChild(el);
                el.classList.remove('correct', 'wrong');
            } else {
                if (selectedItem) selectedItem.style.borderColor = '';
                selectedItem = el;
                el.style.borderColor = 'var(--primary)';
            }
        };

        pool.appendChild(el);
    });

    // Делаем зоны кликабельными для мобильных
    document.querySelectorAll('.dnd-zone').forEach(zone => {
        zone.onclick = () => {
            if (selectedItem) {
                zone.appendChild(selectedItem);
                selectedItem.style.borderColor = '';
                checkDnd();
                selectedItem = null;
            }
        };
    });

    // Проверка при перетаскивании
    window.checkDnd = () => {
        document.querySelectorAll('.dnd-zone').forEach(zone => {
            const zoneIdx = parseInt(zone.dataset.zone);
            const items = zone.querySelectorAll('.dnd-item');
            items.forEach(item => {
                if (parseInt(item.dataset.zone) === zoneIdx) {
                    item.classList.add('correct');
                    item.classList.remove('wrong');
                } else {
                    item.classList.add('wrong');
                    item.classList.remove('correct');
                }
            });
        });
    };
}

function allowDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function drop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (window.draggedItem) {
        e.currentTarget.appendChild(window.draggedItem);
        checkDnd();
        window.draggedItem = null;
    }
}

// 4. Логика Колеса
let isSpinning = false;
function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('wheel-result').innerHTML = "Крутим...";

    const wheel = document.getElementById('wheel');
    const extra = 360 * 5 + Math.random() * 360;
    
    wheel.style.transform = `rotate(${extra}deg)`;

    setTimeout(() => {
        isSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        
        const questions = gameData[currentSection].wheel;
        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        
        document.getElementById('wheel-result').innerHTML = `
            <div style="margin-bottom: 10px;">${randomQ.q}</div>
            <button class="hint-btn" onclick="toggleHint(this)">💡 Показать подсказку</button>
            <div class="hint-text" style="display: none;">${randomQ.h}</div>
        `;
        
        // Сброс поворота для следующего клика
        setTimeout(() => {
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            setTimeout(() => wheel.style.transition = 'transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99)', 50);
        }, 3000);
    }, 3000);
}

// 5. Функция подсказки
function toggleHint(btn) {
    const hint = btn.nextElementSibling;
    if (hint.style.display === 'none') {
        hint.style.display = 'block';
        btn.textContent = 'Скрыть подсказку';
    } else {
        hint.style.display = 'none';
        btn.textContent = '💡 Показать подсказку';
    }
}

// 6. Логика Викторины
function checkQuiz(btn, isCorrect) {
    const parent = btn.parentElement;
    if (parent.dataset.answered) return;
    parent.dataset.answered = 'true';
    
    if (isCorrect) {
        btn.classList.add('correct');
    } else {
        btn.classList.add('wrong');
    }
}

// ==========================================
// СТАРТ
// ==========================================
loadSection(0);
</script>
